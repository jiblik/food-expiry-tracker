<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8fafc">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>מעקב תפוגה</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon-192.png">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-hover: #f1f5f9;
            --text: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --accent: #6366f1;
            --accent-light: #eef2ff;
            --accent-hover: #4f46e5;
            --green: #10b981;
            --green-light: #ecfdf5;
            --green-bg: #d1fae5;
            --orange: #f59e0b;
            --orange-light: #fffbeb;
            --orange-bg: #fef3c7;
            --red: #ef4444;
            --red-light: #fef2f2;
            --red-bg: #fecaca;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow: 0 2px 12px rgba(0,0,0,0.06);
            --shadow-lg: 0 8px 30px rgba(0,0,0,0.08);
        }

        body {
            font-family: 'Rubik', sans-serif;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            padding: 0 16px 100px;
        }

        header {
            text-align: center;
            padding: 32px 0 8px;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 3px;
            color: var(--text);
            text-transform: uppercase;
        }

        .sync-status {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 24px;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .sync-status.syncing { color: var(--orange); }
        .sync-status.error { color: var(--red); }

        /* Tabs */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 24px;
            background: var(--surface);
            border-radius: var(--radius);
            padding: 4px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }

        .tab-btn {
            background: transparent;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            flex: 1;
        }

        .tab-btn:hover {
            color: var(--text);
            background: var(--surface-hover);
        }

        .tab-btn.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 2px 8px rgba(99,102,241,0.3);
        }

        /* FAB */
        .add-btn {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: white;
            font-size: 28px;
            font-weight: 300;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(99,102,241,0.35);
            z-index: 100;
            transition: all 0.25s ease;
        }

        .add-btn:hover {
            transform: translateX(-50%) scale(1.08);
            box-shadow: 0 6px 28px rgba(99,102,241,0.45);
            background: var(--accent-hover);
        }

        /* Product list */
        .products-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .product {
            background: var(--surface);
            padding: 14px 16px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all 0.2s ease;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .product:active {
            transform: scale(0.985);
        }

        .product.warning {
            background: var(--orange-light);
            border-color: var(--orange-bg);
        }

        .product.danger {
            background: var(--red-light);
            border-color: var(--red-bg);
        }

        .product img {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-sm);
            object-fit: cover;
            cursor: pointer;
        }

        .product .no-img {
            width: 48px;
            height: 48px;
            background: var(--surface-hover);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .product-info { flex: 1; min-width: 0; }

        .product-name {
            font-weight: 500;
            font-size: 15px;
            margin-bottom: 3px;
            color: var(--text);
        }

        .product-meta {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .product-price {
            font-size: 13px;
            color: var(--green);
            font-weight: 500;
            margin-top: 2px;
        }

        .product-category {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .product-notes {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            font-style: italic;
        }

        .product-status {
            font-size: 11px;
            font-weight: 500;
            margin-top: 5px;
            padding: 3px 10px;
            border-radius: 20px;
            display: inline-block;
        }

        .product-status.warning {
            color: #92400e;
            background: var(--orange-bg);
        }

        .product-status.danger {
            color: #991b1b;
            background: var(--red-bg);
        }

        .product-actions {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .btn-action {
            background: var(--surface-hover);
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 13px;
            width: 34px;
            height: 34px;
            padding: 0;
            border-radius: 50%;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            background: var(--border);
            transform: scale(1.08);
        }

        .btn-action.delete:hover {
            background: var(--red-light);
            border-color: var(--red-bg);
            color: var(--red);
        }

        .btn-action.eaten:hover {
            background: var(--green-light);
            border-color: var(--green-bg);
            color: var(--green);
        }

        .btn-action.thrown:hover {
            background: var(--orange-light);
            border-color: var(--orange-bg);
            color: var(--orange);
        }

        .empty {
            text-align: center;
            color: var(--text-muted);
            padding: 80px 20px;
            font-size: 15px;
            font-weight: 400;
            line-height: 1.8;
        }

        .loading {
            text-align: center;
            color: var(--text-muted);
            padding: 80px 20px;
            font-weight: 400;
        }

        /* Stats */
        .stats-box {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .stats-title {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .stats-row {
            display: flex;
            justify-content: space-around;
            gap: 10px;
        }

        .stat-item { flex: 1; }

        .stat-value {
            font-size: 26px;
            font-weight: 600;
            color: var(--text);
        }

        .stat-value.eaten { color: var(--green); }
        .stat-value.thrown { color: var(--red); }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 400;
        }

        /* History */
        .history-item {
            background: var(--surface);
            padding: 14px 16px;
            border-radius: var(--radius);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .history-item.eaten {
            border-right: 3px solid var(--green);
        }

        .history-item.thrown {
            border-right: 3px solid var(--red);
        }

        .history-info { flex: 1; }

        .history-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }

        .history-date {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .history-price {
            font-size: 15px;
            font-weight: 600;
        }

        .history-price.eaten { color: var(--green); }
        .history-price.thrown { color: var(--red); }

        .history-actions {
            display: flex;
            gap: 6px;
            margin-right: 10px;
        }

        .history-btn {
            background: var(--surface-hover);
            border: 1px solid var(--border);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .history-btn:hover {
            background: var(--border);
        }

        .history-btn.restore:hover {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
        }

        .history-btn.delete:hover {
            background: var(--red-light);
            border-color: var(--red-bg);
            color: var(--red);
        }

        .export-btn {
            width: 100%;
            padding: 14px;
            background: var(--surface);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 16px;
            transition: all 0.2s ease;
        }

        .export-btn:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        /* Sort */
        .sort-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .sort-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 7px 12px;
            border-radius: 20px;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .sort-btn:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        .sort-btn.active {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
        }

        .sort-btn .arrow {
            font-size: 10px;
            opacity: 0.7;
        }

        /* Scanner */
        .scanner-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            z-index: 1100;
            flex-direction: column;
        }

        .scanner-modal.show { display: flex; }

        .scanner-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.8);
            z-index: 10;
        }

        .scanner-header h3 {
            color: white;
            font-weight: 400;
        }

        .scanner-close {
            background: rgba(255,255,255,0.2);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        #scanner-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #000;
        }

        #scanner-container video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
        }

        #scanner-container #qr-shaded-region {
            border-color: var(--accent) !important;
        }

        .scanner-overlay { display: none; }
        .scanner-line { display: none; }

        .scanner-status {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            font-size: 14px;
            padding: 10px;
            background: rgba(0,0,0,0.6);
        }

        .scan-btn {
            background: var(--accent-light);
            border: 1px solid rgba(99,102,241,0.2);
            padding: 12px 20px;
            border-radius: var(--radius);
            color: var(--accent);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .scan-btn:hover {
            background: rgba(99,102,241,0.15);
        }

        /* Image modal */
        .image-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .image-modal.show { display: flex; }

        .image-modal img {
            max-width: 100%;
            max-height: 90vh;
            border-radius: var(--radius-sm);
        }

        .image-modal-close {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.15);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            color: white;
        }

        /* Form modal */
        .form-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg);
            z-index: 1000;
            overflow-y: auto;
        }

        .form-modal.show { display: block; }

        .form-modal-content {
            padding: 20px;
            max-width: 480px;
            margin: 0 auto;
        }

        .form-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0 28px;
        }

        .form-modal-header h2 {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text);
        }

        .form-modal-close {
            background: var(--surface-hover);
            border: 1px solid var(--border);
            font-size: 16px;
            cursor: pointer;
            color: var(--text-secondary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .form-modal-close:hover {
            background: var(--border);
            color: var(--text);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-family: inherit;
            background: var(--surface);
            color: var(--text);
            transition: all 0.2s ease;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: var(--text-muted);
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
        }

        .form-group select option {
            background: var(--surface);
            color: var(--text);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: flex;
            gap: 12px;
        }

        .form-row .form-group { flex: 1; }

        .image-area {
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 36px;
            text-align: center;
            cursor: pointer;
            background-size: cover;
            background-position: center;
            min-height: 100px;
            transition: all 0.2s ease;
            color: var(--text-muted);
        }

        .image-area:hover {
            border-color: var(--accent);
            background-color: var(--accent-light);
            color: var(--accent);
        }

        #imageInput, #editImageInput { display: none; }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s ease;
        }

        .submit-btn:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 16px rgba(99,102,241,0.3);
        }

        .submit-btn:disabled {
            background: var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .btn-row button { flex: 1; }

        .cancel-btn {
            width: 100%;
            padding: 14px;
            background: var(--surface-hover);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .cancel-btn:hover {
            background: var(--border);
            color: var(--text);
        }

        /* Month selector */
        .month-selector {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .month-nav {
            background: var(--surface);
            border: 1px solid var(--border);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .month-nav:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        .month-nav:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .month-label {
            font-size: 15px;
            font-weight: 500;
            color: var(--text);
            min-width: 120px;
            text-align: center;
        }

        /* Notification banner */
        .notification-banner {
            background: var(--accent-light);
            border: 1px solid rgba(99,102,241,0.2);
            padding: 12px 16px;
            border-radius: var(--radius);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .notification-banner:hover {
            background: rgba(99,102,241,0.1);
        }

        .notification-text {
            font-size: 13px;
            color: var(--accent);
            font-weight: 500;
        }

        .notification-icon {
            font-size: 16px;
            color: var(--accent);
        }

        /* Insights */
        .insights-section {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .insights-title {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .chart-container {
            position: relative;
            height: 200px;
            margin-bottom: 20px;
        }

        .insight-card {
            background: var(--surface-hover);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            margin-bottom: 8px;
        }

        .insight-card-title {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .insight-card-value {
            font-size: 24px;
            font-weight: 600;
        }

        .insight-card-value.good { color: var(--green); }
        .insight-card-value.bad { color: var(--red); }

        .insight-tip {
            background: var(--accent-light);
            border-right: 3px solid var(--accent);
            padding: 12px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 14px;
        }

        .backup-section { margin-top: 20px; }

        .backup-btn {
            width: 100%;
            padding: 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .backup-btn.export {
            background: var(--accent-light);
            color: var(--accent);
            border-color: rgba(99,102,241,0.2);
        }

        .backup-btn.import {
            background: var(--surface);
            color: var(--text-secondary);
        }

        .backup-btn:hover { opacity: 0.85; }

        /* Achievements */
        .achievements {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyohF7wtGg8JP1GuNGUB39MY2xADikFI25lAQPqQDfE-O-gHxC21cR2O0gH0dzM1Qzb/exec';
        let products = [];
        let history = [];
        let currentImage = null;
        let editingProduct = null;
        let disposingProduct = null;
        let currentTab = 'active';
        let currentSort = 'date';
        let sortDirection = 'asc'; // asc = ascending, desc = descending
        let historyMonthOffset = 0; // 0 = חודש נוכחי, -1 = חודש קודם, וכו'

        const categories = {
            dairy: '🥛 חלבי',
            meat: '🥩 בשרי',
            fish: '🐟 דגים',
            vegetables: '🥬 ירקות ופירות',
            bread: '🍞 לחם ומאפים',
            frozen: '🧊 קפוא',
            other: '📦 אחר'
        };

        let scannerActive = false;

        loadProducts();
        loadHistory();
        setInterval(loadProducts, 30000);
        setInterval(loadHistory, 30000);

        document.getElementById('imageInput').onchange = function(e) {
            const file = e.target.files[0];
            if (file) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxSize = 200;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxSize) {
                            height *= maxSize / width;
                            width = maxSize;
                        }
                    } else {
                        if (height > maxSize) {
                            width *= maxSize / height;
                            height = maxSize;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    currentImage = canvas.toDataURL('image/jpeg', 0.5);
                    document.getElementById('imageArea').style.backgroundImage = `url(${currentImage})`;
                    document.getElementById('imageText').style.display = 'none';
                };
                img.src = URL.createObjectURL(file);
            }
        };

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            document.getElementById('activeTab').style.display = 'none';
            document.getElementById('historyTab').style.display = 'none';
            document.getElementById('insightsTab').style.display = 'none';

            if (tab === 'active') {
                document.getElementById('activeTab').style.display = 'block';
            } else if (tab === 'history') {
                document.getElementById('historyTab').style.display = 'block';
                renderHistory();
            } else if (tab === 'insights') {
                document.getElementById('insightsTab').style.display = 'block';
                renderInsights();
            }
        }

        async function loadProducts() {
            try {
                setStatus('SYNCING', 'syncing');
                const response = await fetch(API_URL + '?action=get');
                products = await response.json();
                render();
                setStatus('SYNCED', '');
            } catch (error) {
                setStatus('OFFLINE', 'error');
                console.error(error);
            }
        }

        async function loadHistory() {
            try {
                const response = await fetch(API_URL + '?action=getHistory');
                history = await response.json();
                if (currentTab === 'history') {
                    renderHistory();
                }
            } catch (error) {
                console.error('Error loading history:', error);
            }
        }

        function openAddModal() {
            document.getElementById('addModal').classList.add('show');
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.remove('show');
            document.getElementById('name').value = '';
            document.getElementById('date').value = '';
            document.getElementById('price').value = '';
            document.getElementById('quantity').value = '';
            document.getElementById('weight').value = '';
            document.getElementById('notes').value = '';
            document.getElementById('imageArea').style.backgroundImage = '';
            document.getElementById('imageText').style.display = '';
            currentImage = null;
            hideAutocomplete();
        }

        async function addProduct() {
            const name = document.getElementById('name').value.trim();
            const date = document.getElementById('date').value;
            const category = document.getElementById('category').value;

        function parsePrice(notes) {
            if (!notes) return 0;
            const match = notes.match(/\|price:(\d+\.?\d*)/);
            return match ? parseFloat(match[1]) : 0;
        }

        function parseQuantity(notes) {
            if (!notes) return 0;
            const match = notes.match(/\|qty:(\d+)/);
            return match ? parseInt(match[1]) : 0;
        }

        function parseWeight(notes) {
            if (!notes) return 0;
            const match = notes.match(/\|weight:(\d+)/);
            return match ? parseInt(match[1]) : 0;
        }

        function parseNotes(notes) {
            if (!notes) return '';
            return notes.replace(/\|price:\d+\.?\d*/, '').replace(/\|qty:\d+/, '').replace(/\|weight:\d+/, '').trim();
        }

        function getDays(date) {
            const today = new Date();
            today.setHours(0,0,0,0);
            const exp = new Date(date);
            exp.setHours(0,0,0,0);
            return Math.ceil((exp - today) / (1000 * 60 * 60 * 24));
        }

        function changeSort(sortType) {
            // אם לוחצים על אותו כפתור - שנה כיוון
            if (currentSort === sortType) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort = sortType;
                sortDirection = 'asc';
            }

            // עדכון UI של כפתורים
            document.querySelectorAll('.sort-btn').forEach(btn => {
                btn.classList.remove('active');
                btn.querySelector('.arrow').textContent = '';
            });

            const activeBtn = document.getElementById('sort-' + sortType);
            activeBtn.classList.add('active');
            activeBtn.querySelector('.arrow').textContent = sortDirection === 'asc' ? '▲' : '▼';

            render();
        }

        function sortProducts(productsToSort) {
            return [...productsToSort].sort((a, b) => {
                let comparison = 0;

                switch (currentSort) {
                    case 'date':
                        comparison = new Date(a.date) - new Date(b.date);
                        break;
                    case 'name':
                        comparison = a.name.localeCompare(b.name, 'he');
                        break;
                    case 'price':
                        const priceA = parsePrice(a.notes);
                        const priceB = parsePrice(b.notes);
                        comparison = priceA - priceB;
                        break;
                    case 'category':
                        const catA = categories[a.category] || categories['other'];
                        const catB = categories[b.category] || categories['other'];
                        comparison = catA.localeCompare(catB, 'he');
                        break;
                }

                return sortDirection === 'asc' ? comparison : -comparison;
            });
        }

        function render() {
            const list = document.getElementById('list');

            if (products.length === 0) {
                list.innerHTML = '<div class="empty">אין מוצרים עדיין<br><br>לחץ על + להוספת מוצר</div>';
                return;
            }

            const sortedProducts = sortProducts(products);

            list.innerHTML = sortedProducts.map(p => {
                const days = getDays(p.date);
                let cls = '';
                let status = '';

                if (days < 0) {
                    cls = 'danger';
                    status = '<div class="product-status danger">פג תוקף</div>';
                } else if (days === 0) {
                    cls = 'danger';
                    status = '<div class="product-status danger">פג היום</div>';
                } else if (days === 1) {
                    cls = 'warning';
                    status = '<div class="product-status warning">מחר</div>';
                } else if (days <= 3) {
                    cls = 'warning';
                    status = `<div class="product-status warning">${days} ימים</div>`;
                }

                const dateStr = new Date(p.date).toLocaleDateString('he-IL');
                const img = p.image
                    ? `<img src="${p.image}" alt="" onclick="openImageModal('${p.image}')">`
                    : '<div class="no-img">📦</div>';

                const catName = categories[p.category] || categories['other'];
                const price = parsePrice(p.notes);
                const qty = parseQuantity(p.notes);
                const weight = parseWeight(p.notes);
                const notesText = parseNotes(p.notes);
                const priceHtml = price > 0 ? `<div class="product-price">€${price.toFixed(2)}</div>` : '';
                const qtyParts = [];
                if (qty > 0) qtyParts.push(qty + " יח'");
                if (weight > 0) qtyParts.push(weight + ' גרם');
                const qtyHtml = qtyParts.length > 0 ? `<div class="product-meta">${qtyParts.join(' · ')}</div>` : '';
                const notesHtml = notesText ? `<div class="product-notes">${notesText}</div>` : '';

                return `
                    <div class="product ${cls}">
                        ${img}
                        <div class="product-info">
                            <div class="product-name">${p.name}</div>
                            <div class="product-category">${catName}</div>
                            <div class="product-meta">${dateStr}</div>
                            ${priceHtml}
                            ${qtyHtml}
                            ${notesHtml}
                            ${status}
                        </div>
                        <div class="product-actions">
                            <button class="btn-action" onclick="openEditModal('${p.id}')" title="ערוך">✏️</button>
                            <button class="btn-action eaten" onclick="openDisposeModal('${p.id}')" title="סיים">✓</button>
                            <button class="btn-action delete" onclick="quickDelete('${p.id}')" title="מחק">🗑️</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getSelectedMonthRange() {

        const categoryTranslations = {
            'milk': 'חלב', 'cheese': 'גבינה', 'yogurt': 'יוגורט', 'butter': 'חמאה',
            'cream': 'שמנת', 'eggs': 'ביצים', 'meat': 'בשר', 'chicken': 'עוף',
            'beef': 'בקר', 'fish': 'דג', 'salmon': 'סלמון', 'tuna': 'טונה', 'seafood': 'פירות ים',
            'bread': 'לחם', 'pasta': 'פסטה',
            'rice': 'אורז', 'cereal': 'דגני בוקר', 'juice': 'מיץ', 'water': 'מים',
            'soda': 'משקה מוגז', 'coffee': 'קפה', 'tea': 'תה', 'chocolate': 'שוקולד',
            'cookies': 'עוגיות', 'snack': 'חטיף', 'chips': 'צ\'יפס', 'sauce': 'רוטב',
            'oil': 'שמן', 'sugar': 'סוכר', 'salt': 'מלח', 'spice': 'תבלין',

        // תרגום שם מוצר לעברית
        function translateToHebrew(englishName) {
            if (!englishName) return '';

            // אם כבר בעברית, החזר כמו שזה
            if (/[\u0590-\u05FF]/.test(englishName)) {
                return englishName;
            }

            let hebrewName = englishName.toLowerCase();

            // החלף מילים נפוצות
            for (const [eng, heb] of Object.entries(categoryTranslations)) {
                const regex = new RegExp(`\\b${eng}s?\\b`, 'gi');
                hebrewName = hebrewName.replace(regex, heb);
            }

            // אם לא תורגם כלום, החזר את המקור
            if (hebrewName === englishName.toLowerCase()) {
                return englishName;
            }

            // הפוך לאותיות גדולות בהתחלה
            return hebrewName.charAt(0).toUpperCase() + hebrewName.slice(1);
        }

        async function onBarcodeDetected(code) {
            document.getElementById('scannerStatus').textContent = 'נמצא: ' + code + ' - מחפש מוצר...';

            // עצור סריקה
            await stopScanner();

            try {
                // חיפוש במאגר Open Food Facts - קודם בעברית
                let response = await fetch(`https://he.openfoodfacts.org/api/v0/product/${code}.json`);
                let data = await response.json();

                // אם לא נמצא בעברית, נסה באנגלית
                if (data.status !== 1) {
                    response = await fetch(`https://world.openfoodfacts.org/api/v0/product/${code}.json`);
                    data = await response.json();
                }

                if (data.status === 1 && data.product) {
                    const product = data.product;

                    // העדפה לשם בעברית
                    let name = product.product_name_he ||
                               product.product_name_il ||
                               translateToHebrew(product.product_name) ||
                               product.product_name ||
                               'מוצר לא ידוע';

                    // זיהוי קטגוריה
                    let category = 'other';
                    const cats = (product.categories || product.categories_tags?.join(' ') || '').toLowerCase();

                    if (cats.includes('dairy') || cats.includes('milk') || cats.includes('cheese') ||
                        cats.includes('yogurt') || cats.includes('חלב') || cats.includes('גבינה')) {
                        category = 'dairy';
                    } else if (cats.includes('fish') || cats.includes('seafood') || cats.includes('salmon') ||
                               cats.includes('tuna') || cats.includes('דג') || cats.includes('סלמון')) {
                        category = 'fish';
                    } else if (cats.includes('meat') || cats.includes('chicken') || cats.includes('beef') ||
                               cats.includes('בשר') || cats.includes('עוף')) {
                        category = 'meat';
                    } else if (cats.includes('vegetable') || cats.includes('fruit') || cats.includes('fresh') ||
                               cats.includes('ירק') || cats.includes('פרי')) {
                        category = 'vegetables';
                    } else if (cats.includes('bread') || cats.includes('bakery') || cats.includes('pastry') ||
                               cats.includes('לחם') || cats.includes('מאפה')) {
                        category = 'bread';
                    } else if (cats.includes('frozen') || cats.includes('ice') || cats.includes('קפוא')) {
                        category = 'frozen';
                    }

                    // מלא את הטופס
                    document.getElementById('name').value = name;
                    document.getElementById('category').value = category;

                    // תמונה אם יש
                    if (product.image_front_small_url || product.image_url) {
                        currentImage = product.image_front_small_url || product.image_small_url || null;
                        if (currentImage) {
                            document.getElementById('imageArea').style.backgroundImage = `url(${currentImage})`;
                            document.getElementById('imageText').style.display = 'none';
                        }
                    }

                    closeScanner();
                    alert(`✅ נמצא: ${name}`);
                } else {
                    document.getElementById('scannerStatus').textContent = 'מוצר לא נמצא במאגר. נסה שוב או הזן ידנית.';
                    setTimeout(() => {
                        startScanner();
                    }, 2000);
                }
            } catch (error) {
                console.error('Error fetching product:', error);
                document.getElementById('scannerStatus').textContent = 'שגיאה בחיפוש. נסה שוב.';
                setTimeout(() => {
                    startScanner();
                }, 2000);
            }
        }

        // ========== מאגר מוצרים (מהמוצרים וההיסטוריה שלך) ==========
        function buildCatalog() {
            const seen = {};
            const allItems = [...products, ...history];

            allItems.forEach(item => {
                const name = item.name;
                if (!name) return;

                if (!seen[name]) {
                    seen[name] = {
                        name: name,
                        category: item.category || 'other',
                        price: parsePrice(item.notes),
                        quantity: parseQuantity(item.notes),
                        weight: parseWeight(item.notes),
                        image: item.image || '',
                        count: 1
                    };
                } else {
                    seen[name].count++;
                    // עדכן מחיר, כמות, משקל ותמונה מהמופע האחרון
                    const price = parsePrice(item.notes);
                    if (price > 0) seen[name].price = price;
                    const qty = parseQuantity(item.notes);
                    if (qty > 0) seen[name].quantity = qty;
                    const wt = parseWeight(item.notes);
                    if (wt > 0) seen[name].weight = wt;
                    if (item.image) seen[name].image = item.image;
                }
            });

            // מיין לפי תדירות (הכי נקנה קודם)
            return Object.values(seen).sort((a, b) => b.count - a.count);
        }

        function openCatalog() {
            document.getElementById('catalogModal').classList.add('show');
            document.getElementById('catalogSearch').value = '';
            renderCatalog();
            document.getElementById('catalogSearch').focus();
        }

        function closeCatalog() {
            document.getElementById('catalogModal').classList.remove('show');
        }

        function renderCatalog(filter) {
            const listEl = document.getElementById('catalogList');
            let catalog = buildCatalog();

            if (filter) {
                catalog = catalog.filter(item => item.name.includes(filter));
            }

            if (catalog.length === 0) {
                listEl.innerHTML = `<div class="catalog-empty">
                    ${filter ? 'לא נמצאו מוצרים' : 'עדיין אין מוצרים במאגר.<br>הוסף מוצרים ידנית או סרוק ברקוד,<br>והם יופיעו כאן בפעם הבאה.'}
                </div>`;
                return;
            }

            // קבץ לפי קטגוריות
            const grouped = {};
            catalog.forEach(item => {
                const cat = item.category || 'other';
                if (!grouped[cat]) grouped[cat] = [];
                grouped[cat].push(item);
            });

            let html = '';
            for (const [catKey, items] of Object.entries(grouped)) {
                const catLabel = categories[catKey] || categories['other'];
                html += `<div class="catalog-category-title">${catLabel}</div>`;
                html += '<div class="catalog-items">';
                items.forEach((item, idx) => {
                    const imgHtml = item.image
                        ? `<img class="catalog-item-img" src="${item.image}">`
                        : `<div class="catalog-item-noimg">${(catLabel || '').split(' ')[0]}</div>`;
                    const priceHtml = item.price > 0 ? `<div class="catalog-item-price">€${item.price}</div>` : '';
                    html += `<button class="catalog-item" data-idx="${catKey}-${idx}" onclick="selectFromCatalog(this)">
                        ${imgHtml}
                        <div class="catalog-item-info">
                            <div class="catalog-item-name">${item.name}</div>
                            <div class="catalog-item-meta">נוסף ${item.count} פעמים</div>
                        </div>
                        ${priceHtml}
                    </button>`;
                });
                html += '</div>';
            }

            listEl.innerHTML = html;
            // שמור את הקטלוג כ-data לגישה מהירה
            listEl._catalog = catalog;
            listEl._grouped = grouped;
        }

        function filterCatalog() {
            const query = document.getElementById('catalogSearch').value.trim();
            renderCatalog(query || null);
        }

        function selectFromCatalog(btn) {
            const name = btn.querySelector('.catalog-item-name').textContent;
            const catalog = buildCatalog();
            const item = catalog.find(c => c.name === name);
            if (!item) return;
            fillFromCatalogItem(item);
            closeCatalog();
        }

        function fillFromCatalogItem(item) {
            document.getElementById('name').value = item.name;
            document.getElementById('category').value = item.category || 'other';

            if (item.price > 0) {
                document.getElementById('price').value = item.price;
            }
            if (item.quantity > 0) {
                document.getElementById('quantity').value = item.quantity;
            }
            if (item.weight > 0) {
                document.getElementById('weight').value = item.weight;
            }

            if (item.image) {
                currentImage = item.image;
                document.getElementById('imageArea').style.backgroundImage = `url(${item.image})`;
                document.getElementById('imageText').style.display = 'none';
            }

            // תאריך תפוגה - המשתמש ימלא ידנית
            document.getElementById('date').value = '';
            document.getElementById('date').focus();
            hideAutocomplete();
        }

        // ========== Autocomplete ==========
        let acIndex = -1;

        function onNameInput() {
            const query = document.getElementById('name').value.trim();
            if (query.length < 1) { hideAutocomplete(); return; }

            const catalog = buildCatalog();
            const matches = catalog.filter(item =>
                item.name.includes(query)
            ).slice(0, 6);

            if (matches.length === 0) { hideAutocomplete(); return; }

            const listEl = document.getElementById('autocompleteList');
            const catLabels = { dairy: '🥛', meat: '🥩', fish: '🐟', vegetables: '🥬', bread: '🍞', frozen: '🧊', other: '📦' };

            listEl.innerHTML = matches.map((item, i) => {
                const imgHtml = item.image
                    ? `<img src="${item.image}">`
                    : `<div class="ac-noimg">${catLabels[item.category] || '📦'}</div>`;
                const priceHtml = item.price > 0 ? `<div class="autocomplete-item-price">€${item.price}</div>` : '';
                return `<div class="autocomplete-item${i === acIndex ? ' active' : ''}" onmousedown="selectAutocomplete(${i})">${imgHtml}<div class="autocomplete-item-info"><div class="autocomplete-item-name">${item.name}</div><div class="autocomplete-item-meta">נוסף ${item.count} פעמים</div></div>${priceHtml}</div>`;
            }).join('');

            listEl._matches = matches;
            listEl.classList.add('show');
        }

        function onNameKeydown(e) {
            const listEl = document.getElementById('autocompleteList');
            if (!listEl.classList.contains('show')) return;
            const matches = listEl._matches || [];
            if (matches.length === 0) return;

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                acIndex = Math.min(acIndex + 1, matches.length - 1);
                onNameInput();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                acIndex = Math.max(acIndex - 1, 0);
                onNameInput();
            } else if (e.key === 'Enter' && acIndex >= 0) {
                e.preventDefault();
                selectAutocomplete(acIndex);
            } else {
                acIndex = -1;
            }
        }

        function selectAutocomplete(idx) {
            const listEl = document.getElementById('autocompleteList');
            const matches = listEl._matches || [];
            if (!matches[idx]) return;
            fillFromCatalogItem(matches[idx]);
            acIndex = -1;
        }

        function hideAutocomplete() {
            document.getElementById('autocompleteList').classList.remove('show');
            acIndex = -1;
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.autocomplete-wrapper')) hideAutocomplete();
        });

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('SW registered'))
                .catch(err => console.log('SW registration failed:', err));
        }

        // ========== התראות ==========
        function checkNotificationSupport() {
            if ('Notification' in window && Notification.permission === 'default') {
                document.getElementById('notificationBanner').style.display = 'flex';
            }
        }

        async function requestNotifications() {
            if (!('Notification' in window)) {
                alert('הדפדפן שלך לא תומך בהתראות');
                return;
            }

            const permission = await Notification.requestPermission();
            if (permission === 'granted') {
                document.getElementById('notificationBanner').style.display = 'none';
                checkExpiringProducts();
            }
        }

        function checkExpiringProducts() {
            if (Notification.permission !== 'granted') return;

            const expiringSoon = products.filter(p => {
                const days = getDays(p.date);
                return days >= 0 && days <= 3;
            });

            if (expiringSoon.length > 0) {
                const names = expiringSoon.slice(0, 3).map(p => p.name).join(', ');
                const more = expiringSoon.length > 3 ? ` ועוד ${expiringSoon.length - 3}` : '';

                new Notification('⚠️ מוצרים עומדים לפוג!', {
                    body: `${names}${more}`,
                    icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🍎</text></svg>',
                    tag: 'expiry-warning'
                });
            }
        }

        // בדיקת התראות בטעינה
        setTimeout(checkNotificationSupport, 2000);

        // ========== תובנות וגרפים ==========
        let pieChart = null;

        function renderInsights() {
            renderPieChart();
            renderStats();
            renderAchievements();
        }

        function renderPieChart() {
            const now = new Date();
            const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
            const monthHistory = history.filter(h => new Date(h.date) >= monthStart);

            const eaten = monthHistory.filter(h => h.status === 'eaten').length;
            const thrown = monthHistory.filter(h => h.status === 'thrown').length;

            const ctx = document.getElementById('pieChart').getContext('2d');

            if (pieChart) {
                pieChart.destroy();
            }

            if (eaten === 0 && thrown === 0) {
                pieChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['אין נתונים'],
                        datasets: [{
                            data: [1],
                            backgroundColor: ['rgba(255,255,255,0.1)']
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } }
                    }
                });
                return;
            }

            pieChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['נאכלו 🍽️', 'נזרקו 🗑️'],
                    datasets: [{
                        data: [eaten, thrown],
                        backgroundColor: ['rgba(100,255,150,0.7)', 'rgba(255,100,100,0.7)'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { color: 'rgba(255,255,255,0.8)', font: { size: 14 } }
                        }
                    }
                }
            });
        }

        function renderStats() {
            const now = new Date();
            const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
            const monthHistory = history.filter(h => new Date(h.date) >= monthStart);

            const eaten = monthHistory.filter(h => h.status === 'eaten').length;
            const thrown = monthHistory.filter(h => h.status === 'thrown').length;
            const total = eaten + thrown;

            // אחוז ניצול
            const rate = total > 0 ? Math.round((eaten / total) * 100) : 0;
            const rateEl = document.getElementById('utilizationRate');
            rateEl.textContent = rate + '%';
            rateEl.className = 'insight-card-value ' + (rate >= 70 ? 'good' : 'bad');

            // קטגוריה בזבזנית
            const thrownByCategory = {};
            monthHistory.filter(h => h.status === 'thrown').forEach(h => {
                const cat = h.category || 'other';
                thrownByCategory[cat] = (thrownByCategory[cat] || 0) + 1;
            });

            const wastefulCat = Object.entries(thrownByCategory).sort((a, b) => b[1] - a[1])[0];
            const catEl = document.getElementById('wastefulCategory');
            if (wastefulCat) {
                catEl.textContent = categories[wastefulCat[0]] || 'אחר';
            } else {
                catEl.textContent = 'אין זריקות! 🎉';
                catEl.className = 'insight-card-value good';
            }

            // טיפ
            const tipEl = document.getElementById('insightTip');
            const tips = [
                '💡 קנה כמויות קטנות יותר של מוצרים שנוטים להיזרק',
                '💡 ארגן את המקרר כך שמוצרים ישנים יהיו בחזית',
                '💡 הקפא מוצרים לפני שהם פגים',
                '💡 תכנן ארוחות מראש כדי לצמצם בזבוז',
                '💡 בדוק את המקרר לפני הקניות'
            ];

            if (rate >= 90) {
                tipEl.textContent = '🌟 מעולה! אתה מנצל את המוצרים שלך בצורה מצוינת!';
            } else if (wastefulCat) {
                tipEl.textContent = `💡 נסה לקנות פחות ${categories[wastefulCat[0]] || 'מוצרים'} או להשתמש בהם מהר יותר`;
            } else {
                tipEl.textContent = tips[Math.floor(Math.random() * tips.length)];
            }
        }

        function renderAchievements() {
            const totalEaten = history.filter(h => h.status === 'eaten').length;
            const totalThrown = history.filter(h => h.status === 'thrown').length;
            const totalProducts = products.length;

            const achievements = [
                { id: 'first', icon: '🌱', name: 'התחלה', unlocked: history.length > 0 },
                { id: 'ten', icon: '⭐', name: '10 מוצרים', unlocked: totalEaten >= 10 },
                { id: 'fifty', icon: '🏅', name: '50 מוצרים', unlocked: totalEaten >= 50 },
                { id: 'zero_waste', icon: '♻️', name: 'אפס בזבוז', unlocked: totalEaten >= 10 && totalThrown === 0 },
                { id: 'organized', icon: '📦', name: 'מאורגן', unlocked: totalProducts >= 5 },
                { id: 'master', icon: '👑', name: 'מאסטר', unlocked: totalEaten >= 100 }
            ];

            const listEl = document.getElementById('achievementsList');
            listEl.innerHTML = achievements.map(a => `
                <div class="achievement ${a.unlocked ? 'unlocked' : ''}">
                    <div class="achievement-icon">${a.unlocked ? a.icon : '🔒'}</div>
                    <div class="achievement-name">${a.name}</div>
                </div>
            `).join('');
        }

        // ========== גיבוי ושחזור ==========
        function exportBackup() {
            const backup = {
                version: 1,
                date: new Date().toISOString(),
                // הנתונים האחרים נמצאים ב-Google Sheets
            };

            const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `food-tracker-backup-${new Date().toISOString().split('T')[0]}.json`;
            link.click();

            alert('הגיבוי הורד בהצלחה!');
        }

        function importBackup(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const backup = JSON.parse(e.target.result);

                    alert('הגיבוי שוחזר בהצלחה!');
                    location.reload();
                } catch (err) {
                    alert('שגיאה בקריאת הקובץ');
                }
            };
            reader.readAsText(file);
        }
    </script>
